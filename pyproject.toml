[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gptwrap"
version = "0.1.0"
description = "A small LangChain wrapper around GPT-5: personas, memory, tools, structured output."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aditya Raj Singh" }]
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "pydantic>=2.5",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
gptwrap = "gptwrap.__main__:main"

[project.urls]
Repository = "https://github.com/adityarajsingh1/langchain-gpt5"

[tool.setuptools]
packages = ["gptwrap"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["gptwrap"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
